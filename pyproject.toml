[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptstudy"
version = "1.0.0"
description = "LLM Prompt Engineering Study: zero-shot vs few-shot vs chain-of-thought for support-ticket triage"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
